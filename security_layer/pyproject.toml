[project]
name = "security-layer"
version = "0.1.0"
description = "LLM agent security mitigation layer — trifecta separation, PII detection, input classification, output validation, least privilege, rate limiting, HITL, incident response"
requires-python = ">=3.12, <3.14"
license = "AGPL-3.0-only"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.8.0",
    "basedpyright>=1.28.0",
    "mutmut>=3.5.0",
]

[tool.uv]
required-version = ">=0.6"
# presidio-anonymizer 2.2.364 declares `cryptography>=48.0.1,<49.0.0`, which
# blocks resolving above the vulnerable lines: GHSA-537c-gmf6-5ccf is fixed in
# 48.0.1, PYSEC-2026-3553/3554 in 49.0.0, and PYSEC-2026-3552 (CBC PKCS7
# padding-oracle surface, which presidio's AESCipher exercises) in 50.0.0.
# This override replaces presidio's range with cryptography>=50.0.0 so the
# requirement encodes the actual fix line rather than the vulnerable interval.
# Compat evidence: tests/test_crypto_compat.py round-trips presidio's
# Encrypt -> Decrypt operators (AESCipher AES-CBC/PKCS7 from cryptography) on
# the overridden version.
override-dependencies = ["cryptography>=50.0.0"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "TCH", "RUF", "PERF", "PGH", "S",
]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"../tests/**" = ["S101"]  # pytest asserts are the standard test idiom

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnusedImport = "error"
reportUnusedVariable = "error"
exclude = ["**/mutants/**"]
ignore = ["mutants"]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.mutmut]
paths_to_mutate = "budget.py,hitl.py,incident.py,models.py,output_validation.py,permissions.py,state_machine.py,trifecta.py"
runner = "uv run pytest ../tests/ -x -q --tb=line -k 'not pii_detection and not pii_doc'"
